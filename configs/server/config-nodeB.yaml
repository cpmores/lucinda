# configs/server/config-nodeB.yaml — a second mesh node.
# Serves a model node A lacks, so cross-node execution is observable.
apiVersion: lucinda.dev/v1
kind: NodeConfig
metadata:
  name: node-b
spec:
  http:
    port: 9091

  transport:
    type: libp2p
    libp2p:
      addrs:
        - "/ip4/0.0.0.0/tcp/0"
      outsLength: 20
      insLength: 100

  hardwareMonitor:
    intervalSec: 5

  providers:
    - id: "vllm-b"
      driver: "vllm"
      host: "localhost"
      port: 8000
      max_context_tokens: 2048
      models:
        - id: "qwen-2.5-instruct"
          labels:
            modality: "text"
            employer: "TaskPlanner,TaskCommander,TaskExecutor"
          params_b: 7
          context_tokens: 2048
          min_vram: 17179869184   # 16 GiB
