# configs/server/config.yaml

provider_controller:
  providers:
    - id: "vllm-qwen"
      driver: "vllm"
      host: "localhost"
      port: 8000
      models:
        - "qwen-2.5-gptq"

transport:
  type: "libp2p"
  libp2p:
    addrs:
      - "/ip4/0.0.0.0/tcp/0"
    outs_length: 20
    ins_length: 100

hardware_monitor:
  interval_sec: 5

http:
  port: 9090
