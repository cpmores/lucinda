# configs/server/config.yaml

provider_controller:
  providers:
    - id: "vllm"
      driver: "vllm"
      host: "localhost"
      port: 8000
      max_context_tokens: 2048
      models:
        - id: "qwen-2.5-gptq"
          labels:
            modality: "text"
            employer: "TaskPlanner,TaskCommander,TaskExecutor"
          params_b: 7
          context_tokens: 2048
          min_vram: 17179869184   # 16 GiB

transport:
  type: "libp2p"
  libp2p:
    addrs:
      - "/ip4/0.0.0.0/tcp/0"
    outs_length: 20
    ins_length: 100

hardware_monitor:
  interval_sec: 5

http:
  port: 9090
